<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>凛音 · 控制台</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e4e7ee;
  --accent: #3d6df2; --accent-soft: #e8eefe; --danger: #d94848; --ok: #1f9d63; --warn: #b7791f;
  --radius: 12px; --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --panel: #1a1f29; --text: #e6e9f0; --muted: #8d95a8; --line: #2a3140;
    --accent: #6d93ff; --accent-soft: #23304f; --danger: #f06b6b; --ok: #3ccf8e; --warn: #e0a84a;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 登录 */
/* #root 没有固定高度，百分比高度不生效，所以直接用视口高度 */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.login form {
  width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 32px 28px; box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: 14px;
}
.login h1 { font-size: 20px; margin: 20px 0 4px; }
.login p { margin: 0 0 20px; color: var(--muted); }

/* 布局 */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
aside {
  border-right: 1px solid var(--line); background: var(--panel); padding: 20px 12px;
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
aside .brand { padding: 0 8px 18px; }
nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
nav button {
  all: unset; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted);
}
nav button:hover { background: var(--bg); color: var(--text); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button:focus-visible { outline: 2px solid var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.side-foot { padding: 12px 8px 0; border-top: 1px solid var(--line); }
main { padding: 32px clamp(16px, 4vw, 48px) 120px; max-width: 880px; width: 100%; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.head h2 { margin: 0; font-size: 22px; }
.head p { margin: 4px 0 0; color: var(--muted); }

/* 卡片和配置项 */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 6px 24px; padding: 16px 20px; }
.row + .row { border-top: 1px solid var(--line); }
.row label.name { font-weight: 500; padding-top: 7px; }
.row .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.help { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }
.badge { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.saved { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.badge.set { color: var(--ok); }
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); transition: border-color .15s, background .15s;
}
input:hover, textarea:hover, select:hover { border-color: var(--muted); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); background: var(--panel); }
textarea { min-height: 84px; resize: vertical; }
.invalid input, .invalid textarea, .invalid select { border-color: var(--danger); }
.inline { display: flex; gap: 8px; align-items: center; }
.preview { display: block; max-width: 240px; max-height: 320px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.stack > * { width: 100%; }
.stack > .link { width: auto; }
input[type=search] {
  width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
input[type=search]:focus { outline: none; border-color: var(--accent); background: var(--panel); }
.link { all: unset; color: var(--accent); cursor: pointer; font-size: 12.5px; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

/* 开关 */
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding-top: 5px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 38px; height: 22px; border-radius: 99px; background: var(--line); transition: background .15s; position: relative; }
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 按钮 */
.btn {
  border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .55; cursor: default; filter: none; }
.btn.block { width: 100%; padding: 9px 14px; }

/* 底部保存栏 */
.savebar {
  position: fixed; left: 232px; right: 0; bottom: 0; display: flex; justify-content: center;
  padding: 14px; pointer-events: none; transform: translateY(110%); transition: transform .2s;
}
.savebar.show { transform: none; }
.savebar > div {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 18px;
  box-shadow: 0 8px 30px rgba(20, 30, 60, .15);
}
.toast {
  position: fixed; top: 18px; left: 50%; transform: translate(-50%, -150%);
  visibility: hidden; opacity: 0; transition: transform .2s, opacity .2s, visibility .2s;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
  box-shadow: 0 8px 30px rgba(20, 30, 60, .15); max-width: min(560px, 92vw); z-index: 10;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; opacity: 1; }
.toast.ok { border-left: 3px solid var(--ok); }
.toast.bad { border-left: 3px solid var(--danger); }
.empty { color: var(--muted); padding: 40px; text-align: center; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 12px 10px; }
  aside .brand { padding-bottom: 10px; }
  nav { flex-direction: row; overflow-x: auto; }
  nav button { white-space: nowrap; }
  .side-foot { display: none; }
  main { padding-top: 20px; }
  .row { grid-template-columns: 1fr; }
  .row label.name { padding-top: 0; }
  .savebar { left: 0; }
  .head { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const API = location.pathname.replace(/\/+$/, "") + "/api";
const state = { sections: [], pickers: [], current: null, draft: {}, reset: new Set(), errors: {} };
const PICKER = "pick:"; // 选择页在 state.current / 地址栏里的前缀
const root = document.getElementById("root");

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

async function api(path, options = {}) {
  const resp = await fetch(API + path, {
    credentials: "same-origin",
    ...options,
    headers: { "Content-Type": "application/json", "X-Requested-With": "mytest-webui", ...(options.headers || {}) },
  });
  let data = {};
  try { data = await resp.json(); } catch (e) { data = { ok: false, message: "服务器返回格式不对" }; }
  if (resp.status === 401 && path !== "/login") { renderLogin(); throw new Error("请先登录"); }
  return { status: resp.status, ...data };
}

let toastTimer;
function toast(message, ok = true) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.className = "toast show " + (ok ? "ok" : "bad");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, ok ? 2600 : 5000);
}

const brand = () => h("div", { class: "brand" }, h("span", { class: "brand-mark", "aria-hidden": "true" }, "凛"), "凛音控制台");

/* ---------------- 登录 ---------------- */
function renderLogin(message) {
  const input = h("input", { type: "password", id: "pw", autocomplete: "current-password", required: true });
  const err = h("div", { class: "err", role: "alert" }, message || "");
  const btn = h("button", { class: "btn primary block", type: "submit" }, "登录");
  const form = h("form", {
    onsubmit: async (e) => {
      e.preventDefault();
      btn.disabled = true; err.textContent = "";
      try {
        const r = await api("/login", { method: "POST", body: JSON.stringify({ password: input.value }) });
        if (r.ok) return load();
        err.textContent = r.message || "登录失败";
        input.select();
      } finally { btn.disabled = false; }
    },
  },
    brand(),
    h("h1", {}, "登录"),
    h("p", {}, "NoneBot 插件配置"),
    h("label", { for: "pw", class: "sr-only" }, "密码"),
    input, err,
    h("div", { style: "height:14px" }), btn,
  );
  root.replaceChildren(h("div", { class: "login" }, form));
  input.placeholder = "密码";
  input.focus();
}

/* ---------------- 配置页 ---------------- */
const dirty = () => Object.keys(state.draft).length > 0 || state.reset.size > 0;
const section = () => state.sections.find((s) => s.id === state.current);

function sourceBadge(f) {
  if (state.reset.has(f.key)) return h("span", { class: "badge" }, "将恢复默认");
  if (f.key in state.draft) return h("span", { class: "badge saved" }, "未保存");
  if (f.type === "secret") return h("span", { class: "badge " + (f.has_value ? "set" : "") }, f.has_value ? "已设置" : "未设置");
  if (f.source === "saved") return h("span", { class: "badge saved" }, "已在此修改");
  if (f.source === "env") return h("span", { class: "badge", title: f.env.join(" / ").toUpperCase() }, "来自 .env");
  return null;
}

function setDraft(f, value) {
  state.reset.delete(f.key);
  delete state.errors[f.key];
  const original = f.type === "lines" ? (f.value || []).join("\n") : f.value;
  if (f.type !== "secret" && String(value) === String(original)) delete state.draft[f.key];
  else if (f.type === "secret" && value === "") delete state.draft[f.key];
  else state.draft[f.key] = value;
  updateChrome();
}

function control(f) {
  const id = "f-" + f.key;
  const has = f.key in state.draft;
  const value = has ? state.draft[f.key] : f.value;
  const common = { id, "aria-describedby": f.help ? id + "-help" : null };
  if (f.type === "bool") {
    return h("label", { class: "switch" },
      h("input", { ...common, type: "checkbox", role: "switch", checked: !!value, onchange: (e) => setDraft(f, e.target.checked) }),
      h("span", { class: "track", "aria-hidden": "true" }),
      h("span", { class: "sr-only" }, f.label));
  }
  if (f.type === "select") {
    return h("select", { ...common, onchange: (e) => setDraft(f, e.target.value) },
      f.options.map((o) => h("option", { value: o.value, selected: o.value === value }, o.label)));
  }
  if (f.type === "textarea" || f.type === "lines") {
    const text = f.type === "lines" && Array.isArray(value) ? value.join("\n") : value;
    return h("textarea", { ...common, value: text ?? "", placeholder: f.placeholder || (f.type === "lines" ? "每行一个" : ""), oninput: (e) => setDraft(f, e.target.value) });
  }
  if (f.type === "secret") {
    const input = h("input", {
      ...common, type: "password", autocomplete: "off", spellcheck: "false", value: has ? value : "",
      placeholder: f.has_value ? "已设置，留空表示不修改" : "未设置", oninput: (e) => setDraft(f, e.target.value),
    });
    const toggle = h("button", { class: "btn", type: "button", "aria-label": "显示或隐藏 " + f.label, onclick: () => {
      input.type = input.type === "password" ? "text" : "password";
      toggle.textContent = input.type === "password" ? "显示" : "隐藏";
    } }, "显示");
    return h("div", { class: "inline" }, input, toggle);
  }
  if (f.fetchable) return fetchableControl(f, common, value);
  const numeric = f.type === "int" || f.type === "float";
  return h("input", {
    ...common, type: numeric ? "number" : "text", value: value ?? "", placeholder: f.placeholder || null,
    step: f.type === "int" ? "1" : (numeric ? "any" : null), min: f.min, max: f.max,
    spellcheck: "false", oninput: (e) => setDraft(f, e.target.value),
  });
}

/* 可从接口获取选项的配置项：获取到列表后用下拉框选择，也可以切回手动输入。 */
const fetched = {}; // "分区.配置项" → [{value, label}]
const manual = new Set(); // 用户选择手动输入的配置项

function fetchableControl(f, common, value) {
  const cacheKey = state.current + "." + f.key;
  const options = fetched[cacheKey];
  const current = value ?? "";
  const btn = h("button", { class: "btn", type: "button", onclick: async () => {
    if (dirty()) return toast("请先保存修改（比如 API Key、接口地址），再获取列表", false);
    btn.disabled = true; btn.textContent = "获取中…";
    try {
      const r = await api(`/settings/${encodeURIComponent(state.current)}/options/${encodeURIComponent(f.key)}`, { method: "POST" });
      if (!r.ok) return toast(r.message || "获取失败", false);
      fetched[cacheKey] = r.options;
      manual.delete(cacheKey);
      toast(`获取到 ${r.options.length} 个选项`);
      renderMain(); updateChrome();
      document.getElementById(common.id)?.focus();
    } catch (e) { /* 已处理 */ } finally { btn.disabled = false; btn.textContent = options ? "刷新列表" : "获取列表"; }
  } }, options ? "刷新列表" : "获取列表");

  if (!options || manual.has(cacheKey)) {
    const input = h("input", {
      ...common, type: "text", value: current, placeholder: f.placeholder || null, spellcheck: "false",
      oninput: (e) => setDraft(f, e.target.value),
    });
    const back = options ? h("button", { class: "btn", type: "button", onclick: () => {
      manual.delete(cacheKey); renderMain(); updateChrome();
    } }, "从列表选") : null;
    return h("div", { class: "inline" }, input, back || btn);
  }

  // 当前值不在列表里时保留它，避免一打开就被换掉。
  const list = options.some((o) => o.value === current) || !current
    ? options : [{ value: current, label: current + "（当前值，不在列表中）" }, ...options];
  const search = h("input", {
    type: "search", placeholder: `搜索 ${options.length} 个选项`, "aria-label": "筛选 " + f.label, spellcheck: "false",
    oninput: (e) => {
      const q = e.target.value.trim().toLowerCase();
      for (const opt of select.options) opt.hidden = !!q && !opt.textContent.toLowerCase().includes(q) && opt.value !== select.value;
    },
  });
  const select = h("select", { ...common, onchange: (e) => setDraft(f, e.target.value) },
    !current ? h("option", { value: "", selected: true }, f.key === "reference_id" ? "默认音色" : "请选择") : null,
    f.key === "reference_id" && current ? h("option", { value: "" }, "默认音色") : null,
    list.map((o) => h("option", { value: o.value, selected: o.value === current }, o.label)));
  return h("div", { class: "stack" },
    h("div", { class: "inline" }, search, btn),
    select,
    h("button", { class: "link", type: "button", onclick: () => { manual.add(cacheKey); renderMain(); updateChrome(); } }, "手动输入"));
}

/* 文件槽：上传后立即保存，不走底部的「保存」按钮。 */
function fileRow(s, f) {
  const url = `${API}/files/${encodeURIComponent(s.id)}/${encodeURIComponent(f.key)}`;
  const picker = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp", class: "sr-only", id: "file-" + f.key,
    onchange: async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) return toast("文件太大了，最多 20 MB", false);
      upload.disabled = true; upload.textContent = "上传中…";
      try {
        const r = await api(`/files/${encodeURIComponent(s.id)}/${encodeURIComponent(f.key)}`,
          { method: "PUT", body: file, headers: { "Content-Type": file.type || "application/octet-stream" } });
        toast(r.message || (r.ok ? "已上传" : "上传失败"), !!r.ok);
        if (r.ok) await reloadSection(s.id);
      } catch (err) { /* 已处理 */ } finally { upload.disabled = false; upload.textContent = f.exists ? "更换" : "上传"; }
    } });
  const upload = h("button", { class: "btn" + (f.exists ? "" : " primary"), type: "button", onclick: () => picker.click() }, f.exists ? "更换" : "上传");
  const remove = f.exists ? h("button", { class: "btn", type: "button", onclick: async () => {
    if (!confirm(`确定删除${f.label}吗？`)) return;
    const r = await api(`/files/${encodeURIComponent(s.id)}/${encodeURIComponent(f.key)}`, { method: "DELETE" }).catch(() => null);
    if (r) { toast(r.message || "已删除", !!r.ok); if (r.ok) await reloadSection(s.id); }
  } }, "删除") : null;
  return h("div", { class: "row" },
    h("div", {}, h("label", { class: "name", for: "file-" + f.key }, f.label),
      h("div", { class: "meta" }, h("span", { class: "badge " + (f.exists ? "set" : "") }, f.exists ? "已上传" : "未上传"))),
    h("div", {},
      f.exists ? h("img", { src: `${url}?v=${f.version}`, alt: f.label + "预览", class: "preview" }) : null,
      h("div", { class: "inline", style: "margin-top:8px" }, upload, remove, picker),
      f.help ? h("div", { class: "help" }, f.help) : null));
}

async function reloadSection(id) {
  const r = await api("/settings").catch(() => null);
  if (!r || !r.ok) return;
  state.sections = r.sections;
  if (id === state.current) { renderMain(); updateChrome(); }
}

function fieldRow(f) {
  const canReset = f.source === "saved" && !state.reset.has(f.key);
  return h("div", { class: "row" + (state.errors[f.key] ? " invalid" : "") },
    h("div", {},
      h("label", { class: "name", for: "f-" + f.key }, f.label),
      h("div", { class: "meta" }, sourceBadge(f))),
    h("div", {},
      control(f),
      f.help ? h("div", { class: "help", id: "f-" + f.key + "-help" }, f.help) : null,
      state.errors[f.key] ? h("div", { class: "err", role: "alert" }, state.errors[f.key]) : null,
      canReset ? h("button", { class: "link", type: "button", onclick: () => {
        delete state.draft[f.key]; state.reset.add(f.key); renderMain(); updateChrome();
      } }, f.env.length ? "恢复为 .env / 默认值" : "恢复默认值") : null));
}

/* ---------------- 选择页（比如音色库） ---------------- */
const pickerState = {}; // 选择页 id → { query, mine, language, page, result }
const currentPicker = () => state.current?.startsWith(PICKER)
  ? state.pickers.find((p) => PICKER + p.id === state.current) : null;

async function searchPicker(p, page = 1) {
  const ps = pickerState[p.id];
  ps.loading = true; renderMain();
  try {
    const r = await api(`/pickers/${encodeURIComponent(p.id)}/search`, {
      method: "POST", body: JSON.stringify({ query: ps.query, mine: ps.mine, language: ps.language, page }),
    });
    if (!r.ok) toast(r.message || "搜索失败", false);
    else { ps.result = r; ps.page = page; }
  } catch (e) { /* 已处理 */ } finally { ps.loading = false; renderMain(); }
}

async function assignPick(p, key, item) {
  const target = p.targets.find((t) => t.key === key);
  const r = await api(`/settings/${encodeURIComponent(p.section_id)}`, {
    method: "PUT", body: JSON.stringify({ values: { [key]: item.value } }),
  }).catch(() => null);
  if (!r) return;
  if (!r.ok) return toast(r.message || "保存失败", false);
  const s = state.sections.find((x) => x.id === p.section_id);
  if (s) Object.assign(s, r.section);
  pickerState[p.id].names[item.value] = item.title;
  toast(`已${target ? target.label : "设置"}：${item.title}`);
  renderMain();
}

function renderPicker(p, main) {
  const ps = pickerState[p.id] ||= { query: "", mine: false, language: "zh", page: 1, result: null, loading: false, names: {} };
  const s = state.sections.find((x) => x.id === p.section_id);
  const valueOf = (key) => s?.fields.find((f) => f.key === key)?.value || "";
  const current = h("div", { class: "card", style: "margin-bottom:16px" }, p.targets.map((t) => {
    const v = valueOf(t.key);
    const label = s?.fields.find((f) => f.key === t.key)?.label || t.key;
    return h("div", { class: "row" },
      h("div", {}, h("span", { class: "name" }, label)),
      h("div", { class: "inline" },
        h("span", { style: "flex:1;word-break:break-all" }, v ? (ps.names[v] ? `${ps.names[v]}（${v}）` : v) : "未设置"),
        v ? h("button", { class: "btn", type: "button", onclick: () => assignPick(p, t.key, { value: "", title: "未设置" }) }, "清除") : null));
  }));

  const query = h("input", { type: "search", value: ps.query, placeholder: "按名字搜索，留空看热门", "aria-label": "搜索", spellcheck: "false",
    oninput: (e) => { ps.query = e.target.value; } });
  const language = h("select", { "aria-label": "语言", style: "width:auto", onchange: (e) => { ps.language = e.target.value; } },
    [["", "全部语言"], ["zh", "中文"], ["ja", "日语"], ["en", "英语"]].map(([v, l]) => h("option", { value: v, selected: v === ps.language }, l)));
  const mine = h("label", { class: "inline", style: "white-space:nowrap" },
    h("input", { type: "checkbox", checked: ps.mine, onchange: (e) => { ps.mine = e.target.checked; } }), "只看我的");
  const go = h("button", { class: "btn primary", type: "submit", disabled: ps.loading }, ps.loading ? "搜索中…" : "搜索");
  const form = h("form", { class: "inline", style: "margin-bottom:16px;flex-wrap:wrap", onsubmit: (e) => { e.preventDefault(); searchPicker(p, 1); } },
    h("div", { style: "flex:1;min-width:180px" }, query), language, mine, go);

  let list;
  const r = ps.result;
  if (!r) list = h("div", { class: "empty" }, "点「搜索」开始。需要先在「" + (s?.title || p.section_id) + "」里保存 API Key。");
  else if (!r.items.length) list = h("div", { class: "empty" }, "没有找到");
  else {
    const assigned = new Set(p.targets.map((t) => valueOf(t.key)).filter(Boolean));
    list = h("div", {},
      h("div", { class: "card" }, r.items.map((item) => h("div", { class: "row" },
        h("div", {},
          h("div", { class: "name", style: "padding-top:0;word-break:break-all" }, item.title),
          assigned.has(item.value) ? h("div", { class: "meta" }, h("span", { class: "badge saved" }, "正在使用")) : null),
        h("div", {},
          item.detail ? h("div", { class: "help", style: "margin-top:0" }, item.detail) : null,
          item.sample ? h("audio", { controls: true, preload: "none", src: item.sample, style: "width:100%;margin-top:6px" }) : null,
          h("div", { class: "inline", style: "margin-top:8px;flex-wrap:wrap" },
            p.targets.map((t) => h("button", { class: "btn", type: "button", disabled: valueOf(t.key) === item.value,
              onclick: () => assignPick(p, t.key, item) }, t.label))))))),
      h("div", { class: "inline", style: "justify-content:center;margin-top:16px" },
        h("button", { class: "btn", type: "button", disabled: ps.loading || ps.page <= 1, onclick: () => searchPicker(p, ps.page - 1) }, "上一页"),
        h("span", { class: "help", style: "margin:0" }, `第 ${ps.page} 页` + (r.total ? `，共 ${r.total} 个` : "")),
        h("button", { class: "btn", type: "button", disabled: ps.loading || !r.has_more, onclick: () => searchPicker(p, ps.page + 1) }, "下一页")));
  }
  main.replaceChildren(
    h("div", { class: "head" }, h("div", {}, h("h2", {}, p.title), p.description ? h("p", {}, p.description) : null)),
    current, form, list);
}

function renderMain() {
  const main = document.querySelector("main");
  const p = currentPicker();
  if (p) return renderPicker(p, main);
  const s = section();
  if (!s) { main.replaceChildren(h("div", { class: "empty" }, "没有可配置的项目")); return; }
  const testBtn = s.testable ? h("button", { class: "btn", type: "button", onclick: async () => {
    if (dirty()) return toast("请先保存修改，再测试连接", false);
    testBtn.disabled = true; testBtn.textContent = "测试中…";
    try {
      const r = await api(`/settings/${encodeURIComponent(s.id)}/test`, { method: "POST" });
      toast(r.message || (r.ok ? "测试通过" : "测试失败"), !!r.ok);
    } catch (e) { /* 已处理 */ } finally { testBtn.disabled = false; testBtn.textContent = "测试连接"; }
  } }, "测试连接") : null;
  main.replaceChildren(...[
    h("div", { class: "head" },
      h("div", {}, h("h2", {}, s.title), s.description ? h("p", {}, s.description) : null),
      testBtn),
    h("div", { class: "card" }, s.fields.map(fieldRow)),
    (s.files || []).length ? h("div", { class: "card", style: "margin-top:16px" }, s.files.map((f) => fileRow(s, f))) : null,
    s.accounts ? accountCard(s) : null,
  ].filter(Boolean));
}

/* 账号面板：扫码登录、退出。凭证只在服务端，这里只显示状态。 */
const KIND_NAMES = { qq: "QQ 扫码", wx: "微信扫码", app: "扫码登录" };
let qrTimer = 0;

function accountCard(s) {
  const a = s.accounts;
  const rows = a.items.map((item) => {
    const status = item.logged_in
      ? h("span", { class: "badge set" }, `已登录${item.account_name ? "：" + item.account_name : ""}${item.vip ? " · 会员" : " · 不是会员"}`)
      : item.expired ? h("span", { class: "badge", style: "color:var(--danger)" }, "已失效，需要重新扫码")
      : h("span", { class: "badge" }, "未登录");
    const buttons = (item.login_kinds || []).map((kind) =>
      h("button", { class: "btn" + (item.logged_in ? "" : " primary"), type: "button", onclick: () => openQr(s, item, kind) },
        (item.logged_in ? "换个账号 · " : "") + (KIND_NAMES[kind] || kind)));
    const logout = item.logged_in || item.expired ? h("button", { class: "btn", type: "button", onclick: async () => {
      if (!confirm(`退出${item.name}的登录吗？退出后这个平台的会员歌就放不了了。`)) return;
      const r = await api(`/accounts/${encodeURIComponent(s.id)}/${encodeURIComponent(item.platform)}/logout`, { method: "POST" }).catch(() => null);
      if (r && r.ok) { toast("已退出"); await reloadSection(s.id); }
    } }, "退出") : null;
    return h("div", { class: "row" },
      h("div", {}, h("label", { class: "name" }, item.name), h("div", { class: "meta" }, status)),
      h("div", {},
        h("div", { class: "inline" }, ...buttons, logout),
        item.expired && item.message ? h("div", { class: "err" }, item.message) : null,
        !(item.login_kinds || []).length ? h("div", { class: "help" }, "扫码登录没有开启") : null));
  });
  return h("div", { style: "margin-top:16px" },
    h("h3", { style: "margin:24px 0 8px;font-size:16px" }, a.title),
    a.help ? h("p", { class: "help", style: "white-space:pre-line;margin:0 0 10px" }, a.help) : null,
    a.error ? h("div", { class: "err" }, a.error) : null,
    h("div", { class: "card" }, rows));
}

function closeQr() {
  clearTimeout(qrTimer);
  document.getElementById("qr-modal")?.remove();
}

async function openQr(s, item, kind) {
  closeQr();
  const text = h("p", { class: "help", style: "text-align:center" }, "二维码加载中…");
  const img = h("img", { alt: "登录二维码", style: "display:block;width:220px;height:220px;margin:8px auto;border-radius:8px;background:#fff;object-fit:contain" });
  const box = h("div", { class: "card", style: "padding:20px;max-width:320px;width:92vw;position:relative" },
    h("h3", { style: "margin:0 0 4px;font-size:16px;text-align:center" }, `${item.name} · ${KIND_NAMES[kind] || kind}`),
    img, text,
    h("button", { class: "btn block", type: "button", onclick: closeQr }, "关闭"));
  const modal = h("div", { id: "qr-modal", style: "position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20",
    onclick: (e) => { if (e.target === modal) closeQr(); } }, box);
  document.body.append(modal);
  const r = await api(`/accounts/${encodeURIComponent(s.id)}/${encodeURIComponent(item.platform)}/qr`,
    { method: "POST", body: JSON.stringify({ kind }) }).catch(() => null);
  if (!document.body.contains(modal)) return;
  if (!r || !r.ok) { text.textContent = (r && r.message) || "二维码获取失败"; text.className = "err"; return; }
  img.src = r.image;
  text.textContent = (r.hint || "用手机扫码") + "，然后在手机上确认";
  const deadline = Date.now() + 5 * 60 * 1000;
  const poll = async () => {
    if (!document.body.contains(modal)) return;
    if (Date.now() > deadline) { text.textContent = "二维码过期了，关掉重新打开"; return; }
    const p = await api(`/accounts/${encodeURIComponent(s.id)}/qr/${encodeURIComponent(r.sid)}`, { method: "POST" }).catch(() => null);
    if (!document.body.contains(modal)) return;
    if (!p || !p.ok) { text.textContent = (p && p.message) || "登录失败"; text.className = "err"; return; }
    if (p.status === "scanned") text.textContent = "扫好了，在手机上点确认";
    if (p.status === "expired") { text.textContent = p.message || "二维码过期了，关掉重新打开"; return; }
    if (p.status === "refused") { text.textContent = "手机上取消了登录"; return; }
    if (p.status === "done") {
      closeQr();
      toast(`${item.name}登录成功${p.account ? "：" + p.account : ""}${p.vip === false ? "（这个账号不是会员，会员歌还是放不了）" : ""}`, p.vip !== false);
      await reloadSection(s.id);
      return;
    }
    qrTimer = setTimeout(poll, 2000);
  };
  qrTimer = setTimeout(poll, 2000);
}

function renderNav() {
  const nav = document.querySelector("nav");
  nav.replaceChildren(...state.sections.map((s) => h("button", {
    type: "button", "aria-current": s.id === state.current ? "true" : "false",
    onclick: () => switchTo(s.id),
  }, s.title, s.id === state.current && dirty() ? h("span", { class: "dot", "aria-label": "有未保存的修改" }) : null)),
  ...state.pickers.map((p) => h("button", {
    type: "button", "aria-current": PICKER + p.id === state.current ? "true" : "false",
    onclick: () => switchTo(PICKER + p.id),
  }, p.title)));
}

function updateChrome() {
  renderNav();
  document.querySelector(".savebar").classList.toggle("show", dirty());
  const s = section();
  if (s) s.fields.forEach((f) => {
    const row = document.getElementById("f-" + f.key)?.closest(".row");
    const meta = row?.querySelector(".meta");
    if (meta) meta.replaceChildren(...[sourceBadge(f)].filter(Boolean));
  });
}

function switchTo(id) {
  if (id === state.current) return;
  if (dirty() && !confirm("当前页面有未保存的修改，确定要放弃吗？")) return;
  state.current = id; state.draft = {}; state.reset = new Set(); state.errors = {};
  location.hash = id;
  renderNav(); renderMain(); updateChrome();
  document.querySelector("main h2")?.focus?.();
}

async function save() {
  const s = section();
  const btn = document.getElementById("save");
  btn.disabled = true;
  try {
    const r = await api(`/settings/${encodeURIComponent(s.id)}`, {
      method: "PUT", body: JSON.stringify({ values: state.draft, reset: [...state.reset] }),
    });
    if (r.ok) {
      Object.assign(s, r.section);
      state.draft = {}; state.reset = new Set(); state.errors = {};
      toast("已保存，立即生效");
    } else {
      state.errors = r.errors || {};
      toast(r.message || "保存失败", false);
    }
    renderMain(); updateChrome();
    document.querySelector(".invalid input, .invalid textarea, .invalid select")?.focus();
  } catch (e) { /* 已处理 */ } finally { btn.disabled = false; }
}

function discard() {
  state.draft = {}; state.reset = new Set(); state.errors = {};
  renderMain(); updateChrome();
}

function renderApp() {
  root.replaceChildren(h("div", { class: "app" },
    h("aside", {},
      brand(),
      h("nav", { "aria-label": "配置分区" }),
      h("div", { class: "side-foot" }, h("button", { class: "btn block", type: "button", onclick: async () => {
        if (dirty() && !confirm("有未保存的修改，确定要退出吗？")) return;
        await api("/logout", { method: "POST" }).catch(() => {});
        state.draft = {}; state.reset = new Set();
        renderLogin();
      } }, "退出登录"))),
    h("main", { tabindex: "-1" })),
    h("div", { class: "savebar", role: "region", "aria-label": "保存修改" }, h("div", {},
      h("span", {}, "有未保存的修改"),
      h("button", { class: "btn", type: "button", onclick: discard }, "放弃"),
      h("button", { class: "btn primary", type: "button", id: "save", onclick: save }, "保存"))));
  renderNav(); renderMain(); updateChrome();
}

async function load() {
  const r = await api("/settings").catch(() => null);
  if (!r || !r.ok) return;
  state.sections = r.sections;
  state.pickers = r.pickers || [];
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const known = state.sections.some((s) => s.id === fromHash) || state.pickers.some((p) => PICKER + p.id === fromHash);
  state.current = known ? fromHash : state.sections[0]?.id;
  renderApp();
}

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && dirty()) { e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  const r = await api("/session").catch(() => null);
  if (!r) return renderLogin("无法连接服务器");
  if (!r.enabled) return renderLogin(r.reason || "WebUI 未启用：请在 .env 里设置 WEBUI_PASSWORD 后重启");
  if (r.logged_in) return load();
  renderLogin();
})();
</script>
</body>
</html>
